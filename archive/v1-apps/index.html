<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Ain't Ready</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />

    <style>
      html {
        background-color: black;
        width: 100vw;
        height: 100vh;
      }
      body {
        background: url("./bg.png");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        margin: 0;
        min-height: 100vh;
      }
      .apps {
        display: flex;
        width: 100%;
        padding-top: 100px;
        justify-content: space-evenly;
      }
      .coming {
        justify-self: center;
        margin-top: 50px;
      }
      .tag {
        justify-self: center;
        position: absolute;
        bottom: 0;
      }

      .apps img {
        height: 25vh;
        width: auto;
      }

      .coming img {
        height: 10vh;
        width: auto;
      }

      .tag img {
        height: 10vh;
        width: auto;
      }


    </style>
  </head>
  <body>
    <div class="apps">
      <img height="300" src="./bibl.png" alt="" />
      <img height="300" src="./procratus.png" alt="" />
    </div>
    <div class="coming">
      <img height="100" src="./coming.png" alt="" />
    </div>
    <div class="tag">
      <img height="100" src="./trisphere.png" alt="" />
    </div>
  </body>
</html>
